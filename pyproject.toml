[project]
name = "black-bell-bsh-mcp"
version = "0.1.0"
description = "Deterministic Black Sword Hack mechanics and file-backed campaign state, exposed over Model Context Protocol (MCP)."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{name = "R. Billeci"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "filelock>=3,<4",
  "prompt-toolkit>=3.0.53,<4",
]

[project.scripts]
bsh-mcp = "bsh_mcp.server:main"

[project.urls]
Repository = "https://github.com/rbilleci/storyteller"
Issues = "https://github.com/rbilleci/storyteller/issues"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.16,<1",
]
llm = [
  "openai>=1.60,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# narrator is packaged alongside bsh_mcp so both interpreters can `pip install -e .`
# instead of path-inserting `src`; see README's "Quick start". This
# distribution's own [project.dependencies] (mcp>=2) must never be installed into the
# narrator interpreter (mcp==1.29.0 there) -- install with `--no-deps` in that venv.
packages = ["src/bsh_mcp", "src/narrator"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "tests", "tests_narrator", "rules", "world", "locale", "skills", "config", "docs", "SOUL.md", "README.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "DEFERRED.md", "LICENSE", "NOTICE", "LICENSES", "pyproject.toml", "uv.lock", "requirements-narrator.in", "requirements-narrator.txt", "pytest-narrator.ini", ".gitignore", ".githooks", "package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["campaign", "world", "docs", ".venv", ".narrator-venv"]

[tool.ruff.lint]
# An explicit, curated selection rather than ruff's full default surface (830 rules as
# of 0.16.x, including bandit/async/sys-version checks with little to say about this
# codebase) so the enabled set stays stable across ruff upgrades. BLE and N match this
# repo's pre-existing ``# noqa: BLE001`` / ``# noqa: N806`` comments; E501 is left
# unselected because this codebase's existing line lengths were never written to a
# limit and enforcing one now would be pure churn, not a correctness signal.
# SLF001 (flake8-self) is deliberately omitted too: 230 existing
# ``# noqa: SLF001`` comments already record a repo-wide, considered decision to let
# tests reach into collaborator internals (the engine's own ``_x_once`` seams exist
# for exactly this); re-litigating that is out of scope for a first lint adoption.
select = ["E", "W", "F", "I", "UP", "N", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The star-import shared-header pattern is deliberate here (see each file's own
# docstring): narrator_units_shared.py's ``__all__`` is the real export contract.
"tests/test_narrator_units.py" = ["F403", "F405"]
"tests/test_narrator_sweep_units.py" = ["F403", "F405"]
"tests/test_narrator_canon_units.py" = ["F403", "F405"]
# Model-facing prompt strings, and the multilingual corpora measured against them, are
# measured artifacts (CONTRIBUTING.md): changing one costs re-measurement
# against the live probes. Keep autofix (and any future spelling/style sweep) from
# ever touching these without that step.
"src/narrator/classify.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/facets.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/engine.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/settle.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/sweep.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/assess.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/adjudicate.py" = ["RUF001", "RUF002", "RUF003"]
"src/narrator/locale.py" = ["RUF001", "RUF002", "RUF003"]
"tests_narrator/declaration_corpus.py" = ["RUF001", "RUF002", "RUF003"]
"tests_narrator/harvested_corpus.py" = ["RUF001", "RUF002", "RUF003"]
"tests_narrator/lexical_double.py" = ["RUF001", "RUF002", "RUF003"]
