# 플레이어에게 보이는 터미널 어댑터 텍스트, 한국어판.
# 슬래시로 시작하는 명령어(/help, /character, /quit, /continue, /retry, /revise,
# /dismiss)는 구문(SYNTAX)입니다: 절대 번역하지 마세요.

language: ko-KR

status:
  no_character: "아직 캐릭터 없음"
  hp: "HP $hp/$hp_max"
  doom: "파멸 $die"
  combat: "전투"
  round: ": 라운드 $round"
  turn: "$name 의 차례"
  day: "$day 일차"

sheet:
  backgrounds: "**배경:**"
  stories: "**이야기:**"
  hp: "**HP**"
  doom: "**파멸**"
  armour: "**방어구**"
  weapons: "**무기:**"
  equipment: "**장비:**"
  coins: "**동전:**"
  languages: "**언어:**"
  resources: "**자원:**"
  doses: "**복용분:**"
  gifts: "**은총:**"
  spells: "**주문:**"
  powers: "**권능:**"
  runic_weapon: "**룬 무기:**"
  conditions: "**상태:**"
  scars: "**흉터:**"
  notes: "**메모:**"
  none: "없음"
  shield: " + 방패"
  level: "레벨 $level"
  unlinked: "아직 캐릭터 시트가 없습니다: 이 터미널은 어떤 캐릭터와도 연결되어 있지 않습니다. 캐릭터 생성이 하나를 연결하면 시트가 나타납니다.\n"

commands:
  help: "명령어: /help, /character, /thinking, /language, /quit\n"
  recovery_help: "복구 명령어: /continue, /retry, /revise, /dismiss. /revise 뒤에 새 행동을 잇거나, /revise 텍스트 형태로 입력하세요.\n"
  revise_after: "/revise 뒤에 수정한 행동을 입력하세요.\n"
  revise_now: "수정한 행동을 입력하세요.\n"
  no_decision_open: "열려 있는 결정이 없으므로 숫자를 입력해도 아무 데도 닿지 않습니다. 복구 명령어: /continue, /retry, /revise, /dismiss.\n"
  unknown: "알 수 없는 명령어: $command. /help 를 입력하세요.\n"
  slash_required: "명령어는 이제 / 로 시작합니다. /help 를 입력하세요.\n"
  thinking_show: "사고: $level. 레벨: $levels. 변경하려면 /thinking 뒤에 레벨을 입력하세요.\n"
  thinking_set: "사고를 $level 로 설정했습니다.\n"
  thinking_unknown: "알 수 없는 사고 레벨: $level. 레벨: $levels.\n"
  thinking_unavailable: "이 채널에서는 사고 레벨을 변경할 수 없습니다.\n"
  # 언어 코드는 명령어와 마찬가지로 구문입니다: 번역하지 마세요.
  language_show: "언어: $language. 언어 목록: $languages. 변경하려면 /language 뒤에 언어를 입력하세요.\n"
  language_set: "언어를 $language 로 설정했습니다.\n"
  language_unknown: "알 수 없는 언어: $language. 언어 목록: $languages.\n"
  language_unavailable: "이 채널에서는 언어를 변경할 수 없습니다.\n"

autocomplete:
  # 터미널의 명령어 자동완성 메뉴에 표시되는 짧은 설명. 위의 /명령어와 달리
  # 자유롭게 번역 가능.
  help: "사용 가능한 명령어 표시"
  character: "캐릭터 시트 표시"
  quit: "세션 종료"
  thinking: "내레이터의 사고 수준을 표시하거나 설정"
  language: "테이블의 언어를 표시하거나 설정"
  continue: "이야기된 대로 게임을 계속 진행"
  dismiss: "열려 있는 결정을 취소"
  retry: "내레이터에게 다시 시도해 달라고 요청"
  revise: "마지막 행동을 새 행동으로 교체"

decision:
  prompt: "$name 의 결정"
  enter_number: "숫자를 입력하세요. 결정 도움말은 /help, 닫으려면 /dismiss 를 입력하세요."
  help: "번호가 매겨진 선택지를 고르세요. /dismiss 는 이 프롬프트를 닫습니다. /character 는 캐릭터 시트를 보여줍니다. /quit 은 게임을 떠납니다."
  choose_listed: "나열된 선택지 중 하나를 고르세요.\n"
  describe_approach: "그 접근을 설명하세요: 일반 텍스트로 입력하거나, 선택지 번호 뒤에 . 또는 ) 를 붙여 입력하세요.\n"
  custom_grammar: "$label 의 경우, $marker 뒤에 설명을 입력하세요. 예: $example"
  custom_plain: "일반 텍스트만 입력해도 됩니다: 무엇을 하는지 설명하면 그 접근으로 받아들여집니다."
  custom_example: "지붕을 타고 소리 없이 이동한다"

errors:
  invalid: "그 답은 사용할 수 없습니다. 선택지를 고르세요.\n"
  conflict: "처음 입력한 답이 그대로 유지됩니다.\n"
  stale: "게임 상태가 바뀌어 그 결정은 만료되었습니다.\n"
  cancelled: "그 결정은 더 이상 유효하지 않습니다.\n"
  rejected: "결정이 받아들여지지 않았습니다.\n"

thinking: " 생각 중"
