# Текст терминального адаптера для игроков, на русском.
# Команды с ведущей косой чертой (/help, /character, /quit, /continue, /retry,
# /revise, /dismiss) — это синтаксис, их не переводят.
language: ru-RU
status:
  no_character: "Персонажа пока нет"
  hp: "ОЗ $hp/$hp_max"
  doom: "Рок $die"
  combat: "Бой"
  round: ": раунд $round"
  turn: "ход $name"
  day: "День $day"
sheet:
  backgrounds: "**Происхождение:**"
  stories: "**Истории:**"
  hp: "**ОЗ**"
  doom: "**Рок**"
  armour: "**Броня**"
  weapons: "**Оружие:**"
  equipment: "**Снаряжение:**"
  coins: "**Монеты:**"
  languages: "**Языки:**"
  resources: "**Ресурсы:**"
  doses: "**Дозы:**"
  gifts: "**Дары:**"
  spells: "**Заклинания:**"
  powers: "**Силы:**"
  runic_weapon: "**Руническое оружие:**"
  conditions: "**Состояния:**"
  scars: "**Шрамы:**"
  notes: "**Заметки:**"
  none: "нет"
  shield: " + щит"
  level: "Уровень $level"
  unlinked: "Листа персонажа пока нет: этот терминал не связан ни с одним персонажем. Лист появится, когда создание персонажа свяжет его.\n"
commands:
  help: "Команды: /help, /character, /thinking, /language, /quit\n"
  recovery_help: "Команды восстановления: /continue, /retry, /revise, /dismiss. Используйте /revise и новое действие, либо /revise текст.\n"
  revise_after: "Введите исправленное действие после /revise.\n"
  revise_now: "Введите исправленное действие.\n"
  no_decision_open: "Ни одно решение не открыто, поэтому номер ни к чему не приведёт. Команды восстановления: /continue, /retry, /revise, /dismiss.\n"
  unknown: "Неизвестная команда: $command. Наберите /help.\n"
  slash_required: "Команды теперь начинаются с /. Наберите /help.\n"
  thinking_show: "Размышление: $level. Уровни: $levels. Наберите /thinking и уровень, чтобы изменить его.\n"
  thinking_set: "Размышление установлено на $level.\n"
  thinking_unknown: "Неизвестный уровень размышления: $level. Уровни: $levels.\n"
  thinking_unavailable: "Уровень размышления нельзя изменить на этом канале.\n"
  # Коды языков — это синтаксис, как и команды: не переводить.
  language_show: "Язык: $language. Языки: $languages. Наберите /language и язык, чтобы изменить его.\n"
  language_set: "Язык установлен на $language.\n"
  language_unknown: "Неизвестный язык: $language. Языки: $languages.\n"
  language_unavailable: "Язык нельзя изменить на этом канале.\n"

autocomplete:
  # Краткие описания, показываемые в меню автодополнения команд терминала.
  # Свободный текст, в отличие от /команд выше.
  help: "Показать доступные команды"
  character: "Показать лист персонажа"
  quit: "Покинуть сессию"
  thinking: "Показать или задать, сколько думает рассказчик"
  language: "Показать или задать язык стола"
  continue: "Позволить игре продолжаться, как рассказано"
  dismiss: "Отклонить открытое решение"
  retry: "Попросить рассказчика попробовать снова"
  revise: "Заменить последнее действие новым"

decision:
  prompt: "Решение для $name"
  enter_number: "Введите номер. Наберите /help для справки или /dismiss, чтобы закрыть."
  help: "Выберите пронумерованный вариант. /dismiss закрывает этот запрос. /character показывает ваш лист. /quit выходит из игры."
  choose_listed: "Выберите один из перечисленных вариантов.\n"
  describe_approach: "Опишите этот способ: обычным текстом или номером варианта с . либо ).\n"
  custom_grammar: "Для $label наберите $marker и затем ваше описание. Пример: $example"
  custom_plain: "Обычный текст тоже подойдёт: опишите, что вы делаете, и это будет принято как ваш способ."
  custom_example: "проскользнуть по крышам"
errors:
  invalid: "Такой ответ недоступен. Выберите вариант.\n"
  conflict: "Ваш первый ответ остаётся в силе.\n"
  stale: "Это решение устарело: состояние игры изменилось.\n"
  cancelled: "Это решение больше не активно.\n"
  rejected: "Решение не принято.\n"
thinking: " Думает"
