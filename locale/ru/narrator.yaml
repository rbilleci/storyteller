# Текст рассказчика для игроков, на русском.
# Перевод locale/en/narrator.yaml, ключ в ключ. Команды восстановления (/retry, /revise,
# /dismiss, /continue) — это синтаксис, их не переводят. Каждый $placeholder обязателен.

language: ru-RU

notices:
  decision_fault: "Ничего не произошло: ведущий не смог подготовить безопасное решение. Используйте /retry, /revise или /dismiss."
  decision_stale_context: "Ничего не произошло: состояние стола изменилось, пока это решение было открыто. Используйте /retry, чтобы спросить снова."
  decision_stale_confirmation: "Ничего не произошло: это подтверждение больше не соответствует тому, что вы делаете. Опишите действие заново."
  decision_segment: "Ничего не произошло. Этому этапу решения нужен ещё один игрок. Используйте /continue, /revise или /dismiss."
  decision_declined: "Ничего не произошло: предложенное действие было отклонено."
  risk_confirmation: "Ничего не произошло: эта опасность требует подтверждения с проверкой личности."
  classifier_fault: "Ведущий не смог понять, что делал этот ход; ничего не произошло и кости не бросались. Скажите это ещё раз или переформулируйте."
  romance_boundary: "Ничего не произошло: это развитие недоступно за этим столом."
  trade_confirmation: "Покупка не состоялась: согласованные условия требуют подтверждения с проверкой личности."
  trade_completed: "Подтверждённая покупка записана."
  withheld: "Ведущий удерживает этот ход: его последствия ещё не занесены в запись. Уже брошенные кости остаются в силе - не повторяйте действие. Спросите, что будет дальше."
  fault: "У ведущего произошёл сбой при написании истории этого хода. Уже брошенные кости остаются в силе - не повторяйте действие. Спросите, что будет дальше."
  decision_incomplete: "Ничего не потеряно: подготовка ведущего к этому действию уже занесена в запись и не требует повторения. Само действие в этот ход не завершилось. Используйте /retry, /revise или /dismiss."
  decision_refused: "Действие не разрешилось: движок правил отклонил $refusal, и ничего не изменилось. Используйте /retry, /revise или /dismiss."

confirmations:
  violence: "Это действие может ранить или убить того, кто ещё не сражается с вами. Подтвердить?"
  theft: "Это действие забирает имущество у того, кто его не предлагал. Подтвердить?"
  destructive: "Это действие может уничтожить или необратимо изменить что-либо. Подтвердить?"
  uncategorized: "Это действие может навредить кому-то, что-то отнять или необратимо изменить кого-то или что-то. Подтвердить?"

options:
  confirm: "Подтвердить"
  decline: "Отклонить"
  own_approach: "Опишите свой способ"
  parry: "Парировать (СИЛ)"
  dodge: "Уклониться (ЛОВ)"

decisions:
  # Обязательные плейсхолдеры: $enemy $character
  enemy_turn_question: "$enemy действует. Как $character защищается?"
  enemy_turn_context: "Ход $character наступит после хода $enemy."

roll:
  # Оба числа должны оставаться подписанными: успех здесь — бросок НИЖЕ порога, и
  # неподписанная пара «4 против 13» читается наоборот.
  # Обязательные плейсхолдеры: $name $attribute $total $target $outcome
  announcement: "$name проверяет $attribute: выпало $total против порога $target, $outcome."

doom:
  # Обязательные плейсхолдеры: $name $die $total $result
  announcement: "$name бросает кость Рока ($die): выпало $total, $result."

doom_results:
  held: "кость держится"
  # Обязательный плейсхолдер: $next
  downgraded: "кость падает до $next"
  depleted: "кость Рока израсходована"

runic:
  # Строка ставки рунического оружия; её пишет ДВИЖОК по полю kills_helpless
  # результата (см. английский источник).
  # Required placeholders: $name $wielder
  armed: "$name взвесил $wielder: если $wielder падёт Беспомощным в этой сессии, клинок убьёт $wielder на месте."
  disarmed: "$name не взвесил $wielder: падение Беспомощным в этой сессии не отдаст $wielder клинку."
  armed_next: "$name взвесил $wielder на следующую сессию: если $wielder падёт в ней Беспомощным, клинок убьёт $wielder на месте."
  disarmed_next: "$name не взвесил $wielder на следующую сессию: падение в ней Беспомощным не отдаст $wielder клинку."

attributes:
  STR: "СИЛ"
  DEX: "ЛОВ"
  CON: "ТЕЛ"
  INT: "ИНТ"
  WIS: "МУД"
  CHA: "ХАР"

outcomes:
  success: "успех"
  failure: "провал"
  critical_success: "критический успех"
  critical_failure: "критический провал"
